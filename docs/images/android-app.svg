<circle cx="938" cy="234" r="11" fill="#0A66D6"/><text x="938" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
<text x="958" y="239" font-size="14" font-weight="700" fill="#0f172a">Camera corner = the assistant's eye</text>
<text x="958" y="258" font-size="12.5" fill="#475569">tap = take a photo and ask Xiaozhi what it sees</text>
<text x="958" y="276" font-size="12.5" fill="#475569">⟲ flips back / front camera</text>
<path d="M912,330 C860,330 796,228 736,228" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dot)"/>
<rect x="920" y="312" width="440" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
