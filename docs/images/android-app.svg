<text x="958" y="335" font-size="14" font-weight="700" fill="#0f172a">Connection line (tap to choose robot)</text>
<text x="958" y="354" font-size="12.5" fill="#475569">“Connected (BLE)” · “(USB)” on Android only</text>
<text x="958" y="372" font-size="12.5" fill="#475569">“Controlling via &lt;phone&gt; (WiFi)” on helpers</text>
<path d="M912,426 C860,426 740.0,336 680.0,336" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dot)"/>
<rect x="920" y="408" width="440" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="938" cy="426" r="11" fill="#0A66D6"/><text x="938" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
<text x="958" y="431" font-size="14" font-weight="700" fill="#0f172a">Face + state</text>
<text x="958" y="450" font-size="12.5" fill="#475569">Ready → Listening… → Thinking… → Speaking…</text>
<text x="958" y="468" font-size="12.5" fill="#475569">blue ring and arcs = microphone is live</text>
<path d="M912,522 C860,522 783.0,454 723.0,454" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dot)"/>
<rect x="920" y="504" width="440" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="938" cy="522" r="11" fill="#0A66D6"/><text x="938" y="526" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>
<text x="958" y="527" font-size="14" font-weight="700" fill="#0f172a">Hands-free / Push to speak</text>
<text x="958" y="546" font-size="12.5" fill="#475569">hands-free: just talk, server detects the end</text>
<text x="958" y="564" font-size="12.5" fill="#475569">tap mic while it speaks = interrupt (barge-in)</text>
<path d="M912,618 C860,618 910,584 850,584" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dot)"/>
<rect x="920" y="600" width="440" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="938" cy="618" r="11" fill="#0A66D6"/><text x="938" y="622" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>
<text x="958" y="623" font-size="14" font-weight="700" fill="#0f172a">Chat transcript</text>
<text x="958" y="642" font-size="12.5" fill="#475569">you on the right, Xiaozhi on the left</text>
<text x="958" y="660" font-size="12.5" fill="#475569">» chips = robot actions the AI ran</text>
<path d="M912,714 C860,714 906,692 846,692" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dot)"/>
<rect x="920" y="696" width="440" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="938" cy="714" r="11" fill="#0A66D6"/><text x="938" y="718" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text>
<text x="958" y="719" font-size="14" font-weight="700" fill="#0f172a">Mic + typed command</text>
<text x="958" y="738" font-size="12.5" fill="#475569">typed text goes through the same AI;</text>
<text x="958" y="756" font-size="12.5" fill="#475569">offline → built-in keywords (EN / VI / 中文)</text>
<path d="M912,810 C860,810 910,759 850,759" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dot)"/>
<rect x="920" y="792" width="440" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="938" cy="810" r="11" fill="#0A66D6"/><text x="938" y="814" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text>
<text x="958" y="815" font-size="14" font-weight="700" fill="#0f172a">Quick buttons</text>
<text x="958" y="834" font-size="12.5" fill="#475569">always work, even with no internet</text>
<text x="958" y="852" font-size="12.5" fill="#475569">Stop wins over everything</text>
<path d="M912,906 C860,906 910,827 850,827" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dot)"/>
<rect x="920" y="888" width="440" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="938" cy="906" r="11" fill="#0A66D6"/><text x="938" y="910" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">9</text>
<text x="958" y="911" font-size="14" font-weight="700" fill="#0f172a">Speed slider 25–100 %</text>
<text x="958" y="930" font-size="12.5" fill="#475569">scales every move · “faster” = +15 %</text>
<rect x="40" y="110" width="370" height="860" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="60" y="142" font-size="18" font-weight="700" fill="#0f172a">Get it running</text>
<circle cx="72" cy="180" r="13" fill="#0f172a"/><text x="72" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="96" y="186" font-size="15" font-weight="700" fill="#0f172a">Install</text>
<text x="96" y="208" font-size="12.5" fill="#475569">Download FriendBot-android-debug.apk</text>
<text x="96" y="227" font-size="12.5" fill="#475569">from GitHub Releases → open it →</text>
<text x="96" y="246" font-size="12.5" fill="#475569">allow “install unknown apps”</text>
<text x="96" y="265" font-size="12.5" fill="#475569">(or build: Android Studio → robot/android)</text>
<circle cx="72" cy="322" r="13" fill="#0f172a"/><text x="72" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="96" y="328" font-size="15" font-weight="700" fill="#0f172a">Connect the robot</text>
<text x="96" y="350" font-size="12.5" fill="#475569">USB-C OTG cable to the ESP32 → Robot</text>
<text x="96" y="369" font-size="12.5" fill="#475569">Info → USB on, 115200 baud</text>
<text x="96" y="388" font-size="12.5" fill="#475569">or Bluetooth → “FriendBot: MTV”</text>
<circle cx="72" cy="445" r="13" fill="#0f172a"/><text x="72" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="96" y="451" font-size="15" font-weight="700" fill="#0f172a">Open Voice Control</text>
<text x="96" y="473" font-size="12.5" fill="#475569">Home grid → General → Voice Control</text>
<text x="96" y="492" font-size="12.5" fill="#475569">allow Microphone (and Camera later)</text>
<circle cx="72" cy="549" r="13" fill="#0f172a"/><text x="72" y="554" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="96" y="555" font-size="15" font-weight="700" fill="#0f172a">Pair with Xiaozhi once</text>
<text x="96" y="577" font-size="12.5" fill="#475569">app shows a 6-digit code →</text>
<text x="96" y="596" font-size="12.5" fill="#475569">xiaozhi.me → Add device → enter code</text>
<text x="96" y="615" font-size="12.5" fill="#475569">saved: next launch connects by itself</text>
<circle cx="72" cy="672" r="13" fill="#0f172a"/><text x="72" y="677" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
<text x="96" y="678" font-size="15" font-weight="700" fill="#0f172a">Talk</text>
<text x="96" y="700" font-size="12.5" fill="#475569">“go forward”, “rẽ trái”, “停”</text>
<text x="96" y="719" font-size="12.5" fill="#475569">or “what do you see?” → photo tool</text>
<circle cx="72" cy="776" r="13" fill="#0f172a"/><text x="72" y="781" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
<text x="96" y="782" font-size="15" font-weight="700" fill="#0f172a">More phones (optional)</text>
<text x="96" y="804" font-size="12.5" fill="#475569">2nd phone on same Wi-Fi: open</text>
<text x="96" y="823" font-size="12.5" fill="#475569">Voice Control (drive) or Remote Mic</text>
<rect x="56" y="866" width="338" height="88" rx="10" fill="#eff6ff"/>
<text x="70" y="890" font-size="13.5" font-weight="700" fill="#0A66D6">Example: “đi thẳng 3 giây”</text>
<text x="70" y="912" font-size="12.5" fill="#1e3a8a">Xiaozhi → self.robot.move(forward, 3000 ms)</text>
<text x="70" y="931" font-size="12.5" fill="#1e3a8a">app sends c144,144 every 250 ms (75 %)</text>
<text x="70" y="950" font-size="12.5" fill="#1e3a8a">after 3 s the app sends c0,0 → stop</text>
<text x="40" y="1010" font-size="13" fill="#475569">Android app id org.openbot.app.robot · min Android 7.0 (SDK 24) · target SDK 36 · permissions: microphone, camera, Bluetooth, location</text>
<text x="40" y="1032" font-size="13" fill="#475569">Mock-up drawn from the layout code — colours and spacing are close to, not identical with, the real screen.</text>
</svg>