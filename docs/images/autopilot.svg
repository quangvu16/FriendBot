<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">A neural network looks at each camera frame and outputs the wheel commands</text>
<text x="740" y="197" font-size="12.5" fill="#334155">(left, right) directly — “end-to-end driving”. Default model: CIL-Mobile-Cmd,</text>
<text x="740" y="216" font-size="12.5" fill="#334155">input 256 × 96 pixels, shipped inside the app (assets/config.json).</text>
<rect x="720" y="241" width="640" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="135" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Mount the phone upright, back camera facing forward.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">2. Pick Model, Device (CPU / GPU / NNAPI on Android; CPU / GPU / XNNPACK on iOS)</text>
<text x="740" y="327" font-size="12.5" fill="#334155">   and Threads (1–9). Higher fps = smoother driving.</text>
<text x="740" y="346" font-size="12.5" fill="#334155">3. Turn on Auto Mode. The app sends the network's c&lt;left&gt;,&lt;right&gt; each frame.</text>
<text x="740" y="365" font-size="12.5" fill="#334155">4. Turn Auto Mode off (or press STOP) to take over again.</text>
<rect x="720" y="390" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="390" width="6" height="116" rx="3" fill="#ca8a04"/>
<text x="740" y="416" font-size="15" font-weight="700" fill="#0f172a">Important for FriendBot</text>
<text x="740" y="438" font-size="12.5" fill="#334155">The built-in model was trained on OpenBot's own robots and rooms, not yours.</text>
<text x="740" y="457" font-size="12.5" fill="#334155">Train your own: drive with Data Collection → train with OpenBot's policy</text>
<text x="740" y="476" font-size="12.5" fill="#334155">tools (or the Server drop-down) → load the .tflite in Model Management.</text>
<text x="740" y="495" font-size="12.5" fill="#334155">Your firmware's sonar stop still protects the robot if the model is wrong.</text>
<rect x="720" y="520" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="520" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="546" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="568" font-size="12.5" fill="#334155">12 fps on GPU: the network sees the corridor curving right and outputs</text>
<text x="740" y="587" font-size="12.5" fill="#334155">c150,118 → left wheel faster → FriendBot follows the curve.</text>
</svg>