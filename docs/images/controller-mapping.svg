<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Tests a Bluetooth game controller (PS4/PS5, Xbox, generic). Each button or</text>
<text x="740" y="197" font-size="12.5" fill="#334155">stick you press lights up on the picture, so you know the phone receives it</text>
<text x="740" y="216" font-size="12.5" fill="#334155">before you drive with it in Drive or Data Collection.</text>
<rect x="720" y="241" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="97" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Pair the gamepad in the phone's Bluetooth settings (not in the app).</text>
<text x="740" y="308" font-size="12.5" fill="#334155">2. Open Controller Mapping and press every button; sticks move the dots.</text>
<text x="740" y="327" font-size="12.5" fill="#334155">3. In Drive set Controller = Gamepad.</text>
<rect x="720" y="352" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="116" rx="3" fill="#ca8a04"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">Default buttons (from OpenBot)</text>
<text x="740" y="400" font-size="12.5" fill="#334155">Left stick or R2 / L2 = drive (depends on Drive Mode)</text>
<text x="740" y="419" font-size="12.5" fill="#334155">L1 = next drive mode · R1 = AI network on/off · A = logging on/off</text>
<text x="740" y="438" font-size="12.5" fill="#334155">press left / right stick = slower / faster · Start = noise on/off</text>
<text x="740" y="457" font-size="12.5" fill="#334155">(source: ControlsFragment.processKeyEvent)</text>
<rect x="720" y="482" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="482" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="508" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="530" font-size="12.5" fill="#334155">A pressed → the A circle turns green and, in Data Collection, logging starts.</text>
<text x="740" y="549" font-size="12.5" fill="#334155">Press the right stick twice → speed Slow → Normal → Fast.</text>
</svg>