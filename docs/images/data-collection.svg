<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Records what you see and do while you drive: camera images, your drive</text>
<text x="740" y="197" font-size="12.5" fill="#334155">commands (c&lt;left&gt;,&lt;right&gt;) and phone sensors. This is the training data</text>
<text x="740" y="216" font-size="12.5" fill="#334155">for your own Autopilot model (see Autopilot and Model Management).</text>
<rect x="720" y="241" width="640" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="135" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Connect a gamepad (or drive with the phone) and the robot.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">2. Choose Preview / Model resolution, Save As (Local Storage, Google Drive,</text>
<text x="740" y="327" font-size="12.5" fill="#334155">   Local Server) and which sensors to log (Sensor data: delay in ms, list).</text>
<text x="740" y="346" font-size="12.5" fill="#334155">3. Switch Log Data on (or press A on the gamepad), drive 5–15 minutes</text>
<text x="740" y="365" font-size="12.5" fill="#334155">   along your route, switch it off. A zip file per session is saved.</text>
<rect x="720" y="390" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="390" width="6" height="97" rx="3" fill="#ca8a04"/>
<text x="740" y="416" font-size="15" font-weight="700" fill="#0f172a">Good data = good autopilot</text>
<text x="740" y="438" font-size="12.5" fill="#334155">Drive smoothly, the same way you want the robot to drive.</text>
<text x="740" y="457" font-size="12.5" fill="#334155">Record different light, both directions, and some recoveries</text>
<text x="740" y="476" font-size="12.5" fill="#334155">(drift to the edge, then steer back) so the model learns to correct.</text>
<rect x="720" y="501" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="501" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="527" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="549" font-size="12.5" fill="#334155">10 min at 10 fps ≈ 6 000 image + command pairs: enough for a first</text>
<text x="740" y="568" font-size="12.5" fill="#334155">corridor-following model trained with OpenBot's policy tools.</text>
</svg>