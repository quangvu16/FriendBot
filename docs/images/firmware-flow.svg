<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">FriendBot firmware · what loop() does ~1000 times per second</text>
<text x="40" y="80" font-size="14" fill="#475569">Source: firmware/friendbot-esp32-mtv/friendbot-esp32-mtv.ino — loop(), handle_message(), update_failsafe(), apply_safety(), apply_escape(), update_motors()</text>
<rect x="40" y="110" width="600" height="92" rx="14" fill="#ffffff" stroke="#0A66D6" stroke-width="2.5"/>
<rect x="40" y="110" width="8" height="92" rx="4" fill="#0A66D6"/>
<text x="62" y="140" font-size="16" font-weight="700" fill="#0f172a">1  usb_update / ble_update</text>
<text x="62" y="164" font-size="13" fill="#334155">Read bytes from USB serial and the BLE queue</text>
<text x="62" y="184" font-size="13" fill="#334155">One line = one message, e.g. “c120,120”</text>
<line x1="340" y1="202" x2="340" y2="218" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="220" width="600" height="92" rx="14" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="40" y="220" width="8" height="92" rx="4" fill="#0e7490"/>
<text x="62" y="250" font-size="16" font-weight="700" fill="#0f172a">2  sonar_update</text>
<text x="62" y="274" font-size="13" fill="#334155">Fire one HC-SR04 every 40 ms (no cross-talk)</text>
<text x="62" y="294" font-size="13" fill="#334155">Median of last 3 readings · fault after 2 s</text>
<line x1="340" y1="312" x2="340" y2="328" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="330" width="600" height="92" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
<rect x="40" y="330" width="8" height="92" rx="4" fill="#dc2626"/>
<text x="62" y="360" font-size="16" font-weight="700" fill="#0f172a">3  update_failsafe</text>
<text x="62" y="384" font-size="13" fill="#334155">Heartbeat h&lt;ms&gt; late → command = 0,0</text>
<text x="62" y="404" font-size="13" fill="#334155">(BLE disconnect already stopped the motors)</text>
<line x1="340" y1="422" x2="340" y2="438" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="440" width="600" height="92" rx="14" fill="#ffffff" stroke="#ca8a04" stroke-width="2.5"/>
<rect x="40" y="440" width="8" height="92" rx="4" fill="#ca8a04"/>
<text x="62" y="470" font-size="16" font-weight="700" fill="#0f172a">4  apply_safety</text>
<text x="62" y="494" font-size="13" fill="#334155">Split into forward v + turn w; scale only v</text>
<text x="62" y="514" font-size="13" fill="#334155">mid: slow 50 cm → stop 15 cm · sides: 25 → 10 cm</text>
<line x1="340" y1="532" x2="340" y2="548" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="550" width="600" height="92" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
<rect x="40" y="550" width="8" height="92" rx="4" fill="#c2410c"/>
<text x="62" y="580" font-size="16" font-weight="700" fill="#0f172a">5  update_escape / apply_escape</text>
<text x="62" y="604" font-size="13" fill="#334155">Any sonar &lt; 5 cm: back 400 ms, then turn</text>
<text x="62" y="624" font-size="13" fill="#334155">400 ms toward the more open side</text>
<line x1="340" y1="642" x2="340" y2="658" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="660" width="600" height="92" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
<rect x="40" y="660" width="8" height="92" rx="4" fill="#16a34a"/>
<text x="62" y="690" font-size="16" font-weight="700" fill="#0f172a">6  update_motors</text>
<text x="62" y="714" font-size="13" fill="#334155">Ramp up max 20 duty / 10 ms; slow down at once</text>
<text x="62" y="734" font-size="13" fill="#334155">duty = map(|cmd|, 1..255 → 60..255)</text>
<line x1="340" y1="752" x2="340" y2="768" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="770" width="600" height="92" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="40" y="770" width="8" height="92" rx="4" fill="#7c3aed"/>
<text x="62" y="800" font-size="16" font-weight="700" fill="#0f172a">7  indicators · LCD · report</text>
<text x="62" y="824" font-size="13" fill="#334155">LEDs blink to show turning/stopped</text>
<text x="62" y="844" font-size="13" fill="#334155">LCD row by row · send s&lt;cm&gt; to the app</text>
<polyline points="640,816.0 670,816.0 670,156.0 646,156.0" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="678" y="463.0" font-size="12.5" fill="#334155" transform="rotate(90 678 463.0)" text-anchor="middle">repeat — no delay() anywhere</text>
<rect x="730" y="110" width="630" height="420" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="750" y="142" font-size="18" font-weight="700" fill="#0f172a">Line protocol (stock OpenBot format)</text>
<rect x="740" y="156" width="610" height="34" rx="6" fill="#f1f5f9"/>
<text x="750" y="180" font-size="13" font-weight="700" fill="#0f172a">Message</text>
<text x="880" y="180" font-size="13" font-weight="700" fill="#0f172a">Dir</text>
<text x="930" y="180" font-size="13" font-weight="700" fill="#0f172a">Meaning</text>
<text x="1170" y="180" font-size="13" font-weight="700" fill="#0f172a">Example</text>
<text x="750" y="218" font-size="13" font-family="Menlo, monospace" fill="#0f172a">c&lt;l&gt;,&lt;r&gt;</text>
<text x="880" y="218" font-size="13" fill="#0f172a">→</text>
<text x="930" y="218" font-size="13" fill="#0f172a">drive, each −255…255</text>
<text x="1170" y="218" font-size="13" fill="#0f172a">c192,192 forward</text>
<rect x="740" y="232" width="610" height="34" rx="6" fill="#f8fafc"/>
<text x="750" y="256" font-size="13" font-family="Menlo, monospace" fill="#0f172a">h&lt;ms&gt;</text>
<text x="880" y="256" font-size="13" fill="#0f172a">→</text>
<text x="930" y="256" font-size="13" fill="#0f172a">heartbeat timeout</text>
<text x="1170" y="256" font-size="13" fill="#0f172a">h750 (Android USB)</text>
<text x="750" y="294" font-size="13" font-family="Menlo, monospace" fill="#0f172a">f</text>
<text x="880" y="294" font-size="13" fill="#0f172a">→</text>
<text x="930" y="294" font-size="13" fill="#0f172a">ask for features</text>
<text x="1170" y="294" font-size="13" fill="#0f172a">f</text>
<rect x="740" y="308" width="610" height="34" rx="6" fill="#f8fafc"/>
<text x="750" y="332" font-size="13" font-family="Menlo, monospace" fill="#0f172a">s&lt;ms&gt;</text>
<text x="880" y="332" font-size="13" fill="#0f172a">→</text>
<text x="930" y="332" font-size="13" fill="#0f172a">sonar report period</text>
<text x="1170" y="332" font-size="13" fill="#0f172a">s500</text>
<text x="750" y="370" font-size="13" font-family="Menlo, monospace" fill="#0f172a">i&lt;l&gt;,&lt;r&gt;</text>
<text x="880" y="370" font-size="13" fill="#0f172a">→</text>
<text x="930" y="370" font-size="13" fill="#0f172a">LEDs 0 off 1 on 2 blink 3 auto</text>
<text x="1170" y="370" font-size="13" fill="#0f172a">i2,2 hazard</text>
<rect x="740" y="384" width="610" height="34" rx="6" fill="#f8fafc"/>
<text x="750" y="408" font-size="13" font-family="Menlo, monospace" fill="#0f172a">r</text>
<text x="880" y="408" font-size="13" fill="#0f172a">←</text>
<text x="930" y="408" font-size="13" fill="#0f172a">robot ready</text>
<text x="1170" y="408" font-size="13" fill="#0f172a">after boot / BLE connect</text>
<text x="750" y="446" font-size="13" font-family="Menlo, monospace" fill="#0f172a">fMTV:i:s:</text>
<text x="880" y="446" font-size="13" fill="#0f172a">←</text>
<text x="930" y="446" font-size="13" fill="#0f172a">feature reply</text>
<text x="1170" y="446" font-size="13" fill="#0f172a">type MTV, LEDs, sonar</text>
<rect x="740" y="460" width="610" height="34" rx="6" fill="#f8fafc"/>
<text x="750" y="484" font-size="13" font-family="Menlo, monospace" fill="#0f172a">s&lt;cm&gt;</text>
<text x="880" y="484" font-size="13" fill="#0f172a">←</text>
<text x="930" y="484" font-size="13" fill="#0f172a">closest front distance</text>
<text x="1170" y="484" font-size="13" fill="#0f172a">s42</text>
<text x="750" y="515" font-size="12" fill="#475569">→ phone to robot · ← robot to phone · every line ends with \n · USB 115200 8N1 · BLE UUID 61653dc3-…</text>
<rect x="730" y="560" width="630" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="750" y="592" font-size="18" font-weight="700" fill="#0f172a">Worked example: “go forward” near a wall</text>
<text x="750" y="624" font-size="13.5" fill="#334155">1. App sends c192,192 → v = 192, w = 0</text>
<text x="750" y="646" font-size="13.5" fill="#334155">2. Middle sonar reads 30 cm → factor = (30−15)/(50−15) = 0.43</text>
<text x="750" y="668" font-size="13.5" fill="#334155">3. v = 192 × 0.43 ≈ 82 → safe command c82,82</text>
<text x="750" y="690" font-size="13.5" fill="#334155">4. Duty = map(82, 1..255 → 60..255) ≈ 122 of 255 (48 %)</text>
<text x="750" y="712" font-size="13.5" fill="#334155">5. At 15 cm factor = 0 → forward blocked, LCD shows STOP</text>
<text x="750" y="734" font-size="13.5" fill="#334155">6. Turning (c−150,150) still works: w is never scaled</text>
<text x="750" y="774" font-size="15" font-weight="700" fill="#0f172a">Settings you may change (top of the .ino)</text>
<text x="750" y="802" font-size="12.5" font-family="Menlo, monospace" fill="#0A66D6">MOTOR_DRIVER</text>
<text x="980" y="802" font-size="12.5" fill="#334155">DRIVER_DUAL_INPUT (L298N / MX1508) or DRIVER_PWM_DIR</text>
<text x="750" y="823" font-size="12.5" font-family="Menlo, monospace" fill="#0A66D6">MOTOR_L/R_REVERSED</text>
<text x="980" y="823" font-size="12.5" fill="#334155">1 = that wheel turns the wrong way</text>
<text x="750" y="844" font-size="12.5" font-family="Menlo, monospace" fill="#0A66D6">MOTOR_MIN_DUTY</text>
<text x="980" y="844" font-size="12.5" fill="#334155">60 — raise to 80 if wheels only hum</text>
<text x="750" y="865" font-size="12.5" font-family="Menlo, monospace" fill="#0A66D6">FRONT_STOP/SLOW_CM</text>
<text x="980" y="865" font-size="12.5" fill="#334155">15 / 50 cm · sides 10 / 25 cm</text>
<text x="750" y="886" font-size="12.5" font-family="Menlo, monospace" fill="#0A66D6">SONAR_SAFETY · ESCAPE_CM</text>
<text x="980" y="886" font-size="12.5" fill="#334155">1 · 5 cm</text>
<text x="750" y="907" font-size="12.5" font-family="Menlo, monospace" fill="#0A66D6">NO_PHONE_MODE</text>
<text x="980" y="907" font-size="12.5" fill="#334155">1 = wander alone with the sonars</text>
</svg>