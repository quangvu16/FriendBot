<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">The robot follows an object of a chosen colour with the phone camera.</text>
<text x="740" y="197" font-size="12.5" fill="#334155">Object in the middle third → forward; left third → turn left; right third → turn right;</text>
<text x="740" y="216" font-size="12.5" fill="#334155">colour not seen → stop. A red, blue, green or yellow object works best.</text>
<rect x="720" y="241" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="97" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Connect the robot, mount the phone (camera forward), open Vision Modes → Follow</text>
<text x="740" y="308" font-size="12.5" fill="#334155">   a Coloured Object.  2. Tap the object in the view: the swatch shows the colour.</text>
<text x="740" y="327" font-size="12.5" fill="#334155">3. Press Auto, move the object — the robot follows.  4. Auto off to end.</text>
<rect x="720" y="352" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="116" rx="3" fill="#ca8a04"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">Rules in the code</text>
<text x="740" y="400" font-size="12.5" fill="#334155">A pixel matches when R, G and B are each within the tolerance of the picked colour:</text>
<text x="740" y="419" font-size="12.5" fill="#334155">5–60, step 5, default 15. Every 3rd pixel is checked; ≥ 8 matches = found, and the</text>
<text x="740" y="438" font-size="12.5" fill="#334155">centre of all matches decides the third (the original used only the first match).</text>
<text x="740" y="457" font-size="12.5" fill="#334155">Commands: turn = (−1, 1) / (1, −1), forward = (1, 1), × speed (» button: 128 / 192 / 255).</text>
<rect x="720" y="482" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="482" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="508" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="530" font-size="12.5" fill="#334155">Red ball in the middle third → “▲” → c192,192 at Normal speed.</text>
<text x="740" y="549" font-size="12.5" fill="#334155">Car ignores the ball → raise tolerance to 25; follows the red sofa too → lower it to 10.</text>
</svg>