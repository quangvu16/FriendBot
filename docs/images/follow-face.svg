<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">The camera finds your face and the robot pivots to keep you in the centre.</text>
<text x="740" y="197" font-size="12.5" fill="#334155">Centre third = STOP: the robot turns to face you but never drives at you.</text>
<text x="740" y="216" font-size="12.5" fill="#334155">Try it with the robot on a table and walk round it.</text>
<rect x="720" y="241" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="116" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How it decides</text>
<text x="740" y="289" font-size="12.5" fill="#334155">Android: Google ML Kit face detection (new dependency face-detection 16.1.7).</text>
<text x="740" y="308" font-size="12.5" fill="#334155">iOS: Apple Vision VNDetectFaceLandmarksRequest. Both steer by the NOSE</text>
<text x="740" y="327" font-size="12.5" fill="#334155">landmark like the original (MediaPipe), or the box centre if no nose is found.</text>
<text x="740" y="346" font-size="12.5" fill="#334155">Left third → (−1, 1) spin left · right third → (1, −1) · centre → (0, 0).</text>
<rect x="720" y="371" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="371" width="6" height="78" rx="3" fill="#ca8a04"/>
<text x="740" y="397" font-size="15" font-weight="700" fill="#0f172a">Tips</text>
<text x="740" y="419" font-size="12.5" fill="#334155">Up to about 2 m, good light on your face, no strong backlight.</text>
<text x="740" y="438" font-size="12.5" fill="#334155">One face at a time: the robot follows the first face it finds.</text>
<rect x="720" y="463" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="463" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="489" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="511" font-size="12.5" fill="#334155">You step to the robot's left → face in the left third → “◀ Face found” →</text>
<text x="740" y="530" font-size="12.5" fill="#334155">c-192,192 → the robot spins left until your face is centred, then stops.</text>
</svg>