<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Three virtual sensors along the bottom of the camera view look for black tape.</text>
<text x="740" y="197" font-size="12.5" fill="#334155">Middle sensor black → forward; left black → turn left; right black → turn right;</text>
<text x="740" y="216" font-size="12.5" fill="#334155">no sensor black → stop (“No line”).</text>
<rect x="720" y="241" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="116" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Make a circuit of black tape, thick enough to fill the middle box, no 90° corners.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">2. Mount the phone with the camera angled DOWN at the floor.</text>
<text x="740" y="327" font-size="12.5" fill="#334155">3. Vision Modes → Follow a Black Line; put the robot on the line, middle box on it.</text>
<text x="740" y="346" font-size="12.5" fill="#334155">4. Check the boxes light up on the line; adjust the threshold; press Auto.</text>
<rect x="720" y="371" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="371" width="6" height="97" rx="3" fill="#ca8a04"/>
<text x="740" y="397" font-size="15" font-weight="700" fill="#0f172a">Rules in the code</text>
<text x="740" y="419" font-size="12.5" fill="#334155">Sensor strip = bottom 12 % of the view (SENSOR_HEIGHT_FRACTION 0.12), 3 boxes.</text>
<text x="740" y="438" font-size="12.5" fill="#334155">A box is black when its average grey &lt; threshold: 30–150, step 10, default 90</text>
<text x="740" y="457" font-size="12.5" fill="#334155">(the reference project also used 90). Every 2nd pixel is read (SCAN_STRIDE 2).</text>
<rect x="720" y="482" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="482" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="508" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="530" font-size="12.5" fill="#334155">Averages 214 / 41 / 208 → only the middle is black → forward c192,192.</text>
<text x="740" y="549" font-size="12.5" fill="#334155">Bright room and the line flickers → raise the threshold to 110; floor counts as black → lower it.</text>
</svg>