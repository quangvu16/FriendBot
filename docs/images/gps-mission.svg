<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Drives FriendBot through waypoints using the PHONE's GPS and compass.</text>
<text x="740" y="197" font-size="12.5" fill="#334155">Three modes, like ArduPilot Mission Planner: MISSION (all waypoints in order),</text>
<text x="740" y="216" font-size="12.5" fill="#334155">GUIDED (“Go here now” = one tapped point), RTL (Return home = back to start H).</text>
<rect x="720" y="241" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="116" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Go outside under open sky; wait until Acc shows ≤ 15 m.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">2. Tap the map → “Add as waypoint” (or Add WP / + WP here at your position).</text>
<text x="740" y="327" font-size="12.5" fill="#334155">3. Press Start. Pause / Stop at any time; Return home drives back to H.</text>
<text x="740" y="346" font-size="12.5" fill="#334155">4. Save, or share .waypoints (Mission Planner QGC WPL 110) / export KML.</text>
<rect x="720" y="371" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="371" width="6" height="116" rx="3" fill="#ca8a04"/>
<text x="740" y="397" font-size="15" font-weight="700" fill="#0f172a">Rules in the code</text>
<text x="740" y="419" font-size="12.5" fill="#334155">Waypoint reached within 4 m (defaultAcceptanceRadiusMeters = 4.0).</text>
<text x="740" y="438" font-size="12.5" fill="#334155">Hold if accuracy &gt; 15 m or no fix for 3 s → “No GPS signal — the car stopped”.</text>
<text x="740" y="457" font-size="12.5" fill="#334155">Heading: GPS course when moving, phone compass when standing still</text>
<text x="740" y="476" font-size="12.5" fill="#334155">(“COMPASS UNRELIABLE” → figure-8 calibration, keep phone away from motors).</text>
<rect x="720" y="501" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="501" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="527" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="549" font-size="12.5" fill="#334155">4 waypoints round a park, 86 m total, ≥ 10 m apart. Dist 23 m / Brng 41° = next point</text>
<text x="740" y="568" font-size="12.5" fill="#334155">is 23 m away at bearing 41°. FriendBot's sonars still stop it for a bench or a dog.</text>
<rect x="720" y="593" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="593" width="6" height="78" rx="3" fill="#64748b"/>
<text x="740" y="619" font-size="15" font-weight="700" fill="#0f172a">Android vs iOS</text>
<text x="740" y="641" font-size="12.5" fill="#334155">Android: separate Save, .waypoints and KML buttons; USB or Bluetooth link.</text>
<text x="740" y="660" font-size="12.5" fill="#334155">iOS: Add WP + a Files menu (Open / Share .waypoints, Export KML); Bluetooth only.</text>
</svg>