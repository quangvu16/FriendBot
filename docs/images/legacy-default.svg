<text x="40" y="80" font-size="13" fill="#475569">Source: robot/android/app/src/main/java/.../original/DefaultActivity.java, res/layout/activity_camera.xml, layout_bottom_sheet.xml</text>
<text x="40" y="100" font-size="13" fill="#475569">Feature from OpenBot (www.openbot.org). Mock-ups drawn from the layout code; values shown are examples.</text>
