<text x="195.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Android</text>
<rect x="380" y="140" width="310" height="620" rx="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>
<text x="535.0" y="442.0" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">Not in the iOS app</text>
<text x="535.0" y="466.0" text-anchor="middle" font-size="12.5" fill="#64748b">Android only (Legacy group)</text>
<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">The original OpenBot all-in-one screen from 2020–2022: camera, USB link,</text>
<text x="740" y="197" font-size="12.5" fill="#334155">battery, wheel speed, control/drive/speed modes, data logging, model,</text>
<text x="740" y="216" font-size="12.5" fill="#334155">device and threads — everything in one long bottom sheet.</text>
<rect x="720" y="241" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="97" rx="3" fill="#ca8a04"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">When to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">Only for comparing with the original OpenBot or old tutorials.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">For FriendBot use Drive, Data Collection and Autopilot instead —</text>
<text x="740" y="327" font-size="12.5" fill="#334155">same functions, clearer screens. Android only (More features → Legacy).</text>
<rect x="720" y="352" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="78" rx="3" fill="#64748b"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">Note</text>
<text x="740" y="400" font-size="12.5" fill="#334155">Battery and wheel-speed fields stay empty on FriendBot: its firmware has</text>
<text x="740" y="419" font-size="12.5" fill="#334155">no voltage divider or wheel encoders (see Firmware guide).</text>
</svg>