<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="78" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Lists every neural network the app can use, downloads extra ones,</text>
<text x="740" y="197" font-size="12.5" fill="#334155">and adds your own .tflite files (e.g. an Autopilot you trained for FriendBot).</text>
<rect x="720" y="222" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="222" width="6" height="116" rx="3" fill="#16a34a"/>
<text x="740" y="248" font-size="15" font-weight="700" fill="#0f172a">The list</text>
<text x="740" y="270" font-size="12.5" fill="#334155">Filter: All / AUTOPILOT (CMDNAV) / NAVIGATION (GOALNAV) / DETECTOR.</text>
<text x="740" y="289" font-size="12.5" fill="#334155">Built-in: CIL-Mobile-Cmd (Autopilot), PilotNet-Goal (Point Goal), MobileNetV1-300.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">↓ = download from storage.googleapis.com/openbot_models (MobileNetV3, YOLOv4,</text>
<text x="740" y="327" font-size="12.5" fill="#334155">YOLOv5 s/m/l, EfficientDet L0–L2). Downloaded or added models can be deleted.</text>
<rect x="720" y="352" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="116" rx="3" fill="#ca8a04"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">Add your own model</text>
<text x="740" y="400" font-size="12.5" fill="#334155">Android: + → pick a .tflite file.  iOS: Add New Model → File or URL.</text>
<text x="740" y="419" font-size="12.5" fill="#334155">Then fill Model Details: Name, Class, Type (AUTOPILOT / DETECTOR / NAVIGATION)</text>
<text x="740" y="438" font-size="12.5" fill="#334155">and Input w × h — it must match how the network was trained (e.g. 256 × 96).</text>
<text x="740" y="457" font-size="12.5" fill="#334155">The model then appears in the Model drop-down of that feature.</text>
<rect x="720" y="482" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="482" width="6" height="78" rx="3" fill="#64748b"/>
<text x="740" y="508" font-size="15" font-weight="700" fill="#0f172a">Android only</text>
<text x="740" y="530" font-size="12.5" fill="#334155">⟳ syncs the model list from Google Drive — needs Google sign-in with your own</text>
<text x="740" y="549" font-size="12.5" fill="#334155">Firebase set-up (the repo ships a placeholder google-services.json).</text>
<rect x="720" y="574" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="574" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="600" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="622" font-size="12.5" fill="#334155">Train “my-friendbot-v1.tflite” → add it as AUTOPILOT, 256 × 96 →</text>
<text x="740" y="641" font-size="12.5" fill="#334155">Autopilot → Model → my-friendbot-v1 → Auto Mode on.</text>
</svg>