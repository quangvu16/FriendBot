<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">The robot drives forward and turns away from an obstacle you mark by colour.</text>
<text x="740" y="197" font-size="12.5" fill="#334155">The reference project never finished this stage (it only boxed a mug in 3D);</text>
<text x="740" y="216" font-size="12.5" fill="#334155">FriendBot completes it: far → drive on, close → stop and turn to the clearer side.</text>
<rect x="720" y="241" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="97" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Vision Modes → Object Avoidance.  2. Tap the obstacle in the view to pick its colour.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">3. Press Auto: the robot drives forward while the way is clear.</text>
<text x="740" y="327" font-size="12.5" fill="#334155">4. Put the obstacle in its path: when it fills enough of the view, the robot turns away.</text>
<rect x="720" y="352" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="97" rx="3" fill="#ca8a04"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">Rules in the code</text>
<text x="740" y="400" font-size="12.5" fill="#334155">Stop distance = % of the view the obstacle colour must fill: 2–40, step 2, default 10.</text>
<text x="740" y="419" font-size="12.5" fill="#334155">Below it (or &lt; 8 matching pixels) → forward (1, 1). Above it → pivot toward the</text>
<text x="740" y="438" font-size="12.5" fill="#334155">side with fewer obstacle pixels: (−1, 1) left or (1, −1) right. RGB tolerance 20.</text>
<rect x="720" y="463" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="463" width="6" height="78" rx="3" fill="#64748b"/>
<text x="740" y="489" font-size="15" font-weight="700" fill="#0f172a">Safety</text>
<text x="740" y="511" font-size="12.5" fill="#334155">FriendBot's firmware sonars still slow the robot from 50 cm and stop it at 15 cm,</text>
<text x="740" y="530" font-size="12.5" fill="#334155">even for obstacles of any other colour. Use a colour that stands out from floor and walls.</text>
</svg>