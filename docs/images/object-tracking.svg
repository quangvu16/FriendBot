<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Finds an object class in the camera image (e.g. person, dog, ball) and drives</text>
<text x="740" y="197" font-size="12.5" fill="#334155">towards it — a simple “follow me”. 14 detector models: MobileNet, YOLOv4/v5,</text>
<text x="740" y="216" font-size="12.5" fill="#334155">EfficientDet. MobileNetV1-300 is built in; others download in Model Management.</text>
<rect x="720" y="241" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="116" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">Steering rule (MultiBoxTracker.updateTarget)</text>
<text x="740" y="289" font-size="12.5" font-family="Menlo, monospace" fill="#334155">x = 1 − 2·centreX / imageWidth   (−1 = right edge … +1 = left edge)</text>
<text x="740" y="308" font-size="12.5" font-family="Menlo, monospace" fill="#334155">object right of centre → left 1.0, right 1 − |x|  (turn right)</text>
<text x="740" y="327" font-size="12.5" font-family="Menlo, monospace" fill="#334155">object left of centre  → left 1 − x, right 1.0   (turn left)</text>
<text x="740" y="346" font-size="12.5" fill="#334155">Dynamic Speed: bigger box = closer → slower; box &gt; 75 % of frame → stop.</text>
<rect x="720" y="371" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="371" width="6" height="97" rx="3" fill="#ca8a04"/>
<text x="740" y="397" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="419" font-size="12.5" fill="#334155">1. Pick Object (COCO classes: person, cat, sports ball …) and Model.</text>
<text x="740" y="438" font-size="12.5" fill="#334155">2. Confidence − / + in 5 % steps (default 50 %): higher = fewer false boxes.</text>
<text x="740" y="457" font-size="12.5" fill="#334155">3. Turn on Auto Mode (and Dynamic Speed to keep a distance).</text>
<rect x="720" y="482" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="482" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="508" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="530" font-size="12.5" fill="#334155">“person 0.82” slightly right of centre → x = −0.29 → left 1.00, right 0.71</text>
<text x="740" y="549" font-size="12.5" fill="#334155">→ ×192 (Normal speed) ≈ c192,136 → FriendBot turns right towards you.</text>
</svg>