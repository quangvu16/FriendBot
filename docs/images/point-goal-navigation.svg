<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="116" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">You type a goal relative to the robot — e.g. 1.0 m forward, 0 m left — and the</text>
<text x="740" y="197" font-size="12.5" fill="#334155">robot drives there by itself. The phone tracks its own position with AR</text>
<text x="740" y="216" font-size="12.5" fill="#334155">(ARCore on Android, ARKit on iOS) and the PilotNet-Goal network (160 × 90)</text>
<text x="740" y="235" font-size="12.5" fill="#334155">steers around obstacles it sees in the camera.</text>
<rect x="720" y="260" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="260" width="6" height="116" rx="3" fill="#16a34a"/>
<text x="740" y="286" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="308" font-size="12.5" fill="#334155">1. Mount the phone on FriendBot, camera forward, in a well-lit room with texture</text>
<text x="740" y="327" font-size="12.5" fill="#334155">   (AR needs visible features — the yellow dots).</text>
<text x="740" y="346" font-size="12.5" fill="#334155">2. Set Goal: Forward [m] and Left [m] (negative Left = to the right) → Start.</text>
<text x="740" y="365" font-size="12.5" fill="#334155">3. It says “Goal reached.” — or “Tracking lost.” if AR loses its position.</text>
<rect x="720" y="390" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="390" width="6" height="78" rx="3" fill="#ca8a04"/>
<text x="740" y="416" font-size="15" font-weight="700" fill="#0f172a">Needs</text>
<text x="740" y="438" font-size="12.5" fill="#334155">Android: a phone that supports Google Play Services for AR (ARCore).</text>
<text x="740" y="457" font-size="12.5" fill="#334155">iOS: any iPhone that runs ARKit world tracking (iPhone 6s or newer).</text>
<rect x="720" y="482" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="482" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="508" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="530" font-size="12.5" fill="#334155">Forward 2.0, Left −0.5 → goal 2 m ahead and 0.5 m to the right.</text>
<text x="740" y="549" font-size="12.5" fill="#334155">Messages from the code: “Goal reached.”, “Tracking lost.”, “AR Core session paused.”</text>
</svg>