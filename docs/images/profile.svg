<rect x="720" y="130" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="78" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Signs in with a Google account so the app can use Google Drive:</text>
<text x="740" y="197" font-size="12.5" fill="#334155">sync models, open Drive projects, upload Data Collection zip files.</text>
<rect x="720" y="222" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="222" width="6" height="116" rx="3" fill="#ca8a04"/>
<text x="740" y="248" font-size="15" font-weight="700" fill="#0f172a">Important for FriendBot</text>
<text x="740" y="270" font-size="12.5" fill="#334155">The repository ships a placeholder Firebase file (google-services.json /</text>
<text x="740" y="289" font-size="12.5" fill="#334155">GoogleService-Info.plist with a dummy key), so sign-in will not work</text>
<text x="740" y="308" font-size="12.5" fill="#334155">until you create your own Firebase project and replace those files.</text>
<text x="740" y="327" font-size="12.5" fill="#334155">Everything else — driving, Voice Control, AI, GPS — works without it.</text>
<rect x="720" y="352" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="78" rx="3" fill="#16a34a"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">How to open it</text>
<text x="740" y="400" font-size="12.5" fill="#334155">Android: profile icon in the top bar of the home screen.</text>
<text x="740" y="419" font-size="12.5" fill="#334155">iOS: profile button on the home screen.</text>
