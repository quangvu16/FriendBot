<text x="24" y="366" font-size="10" font-weight="400" fill="#1e3a8a" text-anchor="start">Pick “FriendBot: MTV”. The robot LCD</text>
<text x="24" y="382" font-size="10" font-weight="400" fill="#1e3a8a" text-anchor="start">then shows  BLE  on its first line.</text>
