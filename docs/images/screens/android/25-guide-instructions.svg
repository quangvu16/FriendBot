<text x="14" y="18" font-size="10" font-weight="400" fill="#374151" text-anchor="start">9:41</text>
<circle cx="145.0" cy="12" r="4" fill="#0f172a"/>
<text x="276" y="18" font-size="10" font-weight="400" fill="#374151" text-anchor="end">▾ ◢ ▮</text>
<rect x="0" y="26" width="290" height="44" rx="0" fill="#ffffff"/>
<text x="14" y="54" font-size="16" font-weight="400" fill="#111827" text-anchor="start">←</text>
<text x="42" y="54" font-size="15" font-weight="600" fill="#111827" text-anchor="start">Face Instructions</text>
<line x1="0" y1="70" x2="290" y2="70" stroke="#e5e7eb"/>
<text x="16" y="108" font-size="17" font-weight="800" fill="#111827" text-anchor="start">Follow a Face</text>
<text x="16" y="132" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">The phone camera detects your face and the</text>
<text x="16" y="147" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">car pivots to keep you in the centre of the</text>
<text x="16" y="162" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">view. The centre zone means stop: the car</text>
<text x="16" y="177" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">only turns to face you, it never drives</text>
<text x="16" y="192" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">toward you.</text>
<text x="16" y="230" font-size="13" font-weight="800" fill="#111827" text-anchor="start">You will need</text>
<text x="16" y="250" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  The FriendBot car, charged and connected</text>
<text x="16" y="266" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  A phone mounted on the car, camera facing you</text>
<text x="16" y="282" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  A face! Good lighting helps a lot</text>
<text x="16" y="322" font-size="13" font-weight="800" fill="#111827" text-anchor="start">Steps</text>
<text x="16" y="342" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">1.  Connect the app to the car, mount the phone.</text>
<text x="16" y="358" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">2.  Open Vision Modes → Follow a Face.</text>
<text x="16" y="374" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">3.  Press Auto. A box appears round your face.</text>
<text x="16" y="390" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">4.  Move left or right — the car pivots.</text>
<text x="16" y="406" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">5.  Stand in the centre to stop the car.</text>
<text x="16" y="422" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">6.  Press Auto off to end.</text>
<text x="16" y="462" font-size="13" font-weight="800" fill="#111827" text-anchor="start">Tips</text>
<text x="16" y="482" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  Works best up to about 2 metres.</text>
<text x="16" y="498" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  Avoid strong backlight.</text>
<text x="16" y="514" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  One face at a time works best.</text>
<text x="16" y="548" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Adapted from Kirstin813's L4 Individual Project:</text>
<text x="16" y="561" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Self Driving Robot Using Web Bluetooth on a Smartphone.</text>
</g></g>
</svg>