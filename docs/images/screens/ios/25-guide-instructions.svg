<svg xmlns="http://www.w3.org/2000/svg" width="330" height="640" viewBox="-20 -20 330 640" font-family="Inter, Helvetica, Arial, sans-serif">
<title>FriendBot iOS · Instruction pages (Guides)</title>
<rect x="-20" y="-20" width="330" height="640" fill="#f8fafc"/>
<g transform="translate(0,0)">
<rect x="-10" y="-10" width="310" height="620" rx="48" fill="#0f172a"/>
<clipPath id="c0"><rect x="0" y="0" width="290" height="600" rx="40"/></clipPath>
<g clip-path="url(#c0)"><rect width="290" height="600" fill="#f2f2f7"/>
<text x="22" y="24" font-size="11.5" font-weight="700" fill="#111827" text-anchor="start">9:41</text>
<rect x="99.0" y="9" width="92" height="22" rx="11" fill="#0f172a"/>
<text x="12" y="64" font-size="13" font-weight="400" fill="#0A66D6" text-anchor="start">‹ Back</text>
<text x="145.0" y="64" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">Face Instructions</text>
<text x="16" y="110" font-size="17" font-weight="800" fill="#111827" text-anchor="start">Follow a Face</text>
<text x="16" y="134" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">The phone camera detects your face and the</text>
<text x="16" y="149" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">car pivots to keep you in the centre of the</text>
<text x="16" y="164" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">view. The centre zone means stop: the car</text>
<text x="16" y="179" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">only turns to face you, it never drives</text>
<text x="16" y="194" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">toward you.</text>
<text x="16" y="232" font-size="13" font-weight="800" fill="#111827" text-anchor="start">You will need</text>
<text x="16" y="252" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  The FriendBot car, charged and connected</text>
<text x="16" y="268" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  A phone mounted on the car, camera facing you</text>
<text x="16" y="284" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  A face! Good lighting helps a lot</text>
<text x="16" y="324" font-size="13" font-weight="800" fill="#111827" text-anchor="start">Steps</text>
<text x="16" y="344" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">1.  Connect the app to the car, mount the phone.</text>
<text x="16" y="360" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">2.  Open Vision Modes → Follow a Face.</text>
<text x="16" y="376" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">3.  Press Auto. A box appears round your face.</text>
<text x="16" y="392" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">4.  Move left or right — the car pivots.</text>
<text x="16" y="408" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">5.  Stand in the centre to stop the car.</text>
<text x="16" y="424" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">6.  Press Auto off to end.</text>
<text x="16" y="464" font-size="13" font-weight="800" fill="#111827" text-anchor="start">Tips</text>
<text x="16" y="484" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  Works best up to about 2 metres.</text>
<text x="16" y="500" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  Avoid strong backlight.</text>
<text x="16" y="516" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">•  One face at a time works best.</text>
<text x="16" y="550" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Adapted from Kirstin813's L4 Individual Project:</text>
<text x="16" y="563" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Self Driving Robot Using Web Bluetooth on a Smartphone.</text>
<rect x="85.0" y="588" width="120" height="4" rx="2" fill="#0f172a"/>
</g></g>
</svg>