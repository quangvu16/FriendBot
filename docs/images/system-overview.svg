<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">FriendBot · how the whole system fits together</text>
<text x="40" y="80" font-size="14" fill="#475569">Based on OpenBot (www.openbot.org). Sources: robot/android/.../robot/voice/*, robot/ios/.../Controllers/VoiceControl/*, firmware/friendbot-esp32-mtv/friendbot-esp32-mtv.ino</text>
<rect x="40" y="130" width="250" height="150" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
<rect x="40" y="130" width="8" height="150" rx="4" fill="#64748b"/>
<text x="62" y="160" font-size="17" font-weight="700" fill="#0f172a">You</text>
<text x="62" y="184" font-size="13" fill="#334155">speak in English, Tiếng Việt</text>
<text x="62" y="204" font-size="13" fill="#334155">or 中文</text>
<text x="62" y="224" font-size="13" fill="#334155">e.g. “đi thẳng 3 giây”</text>
<text x="62" y="244" font-size="13" fill="#334155">or tap a quick button</text>
<rect x="470" y="120" width="460" height="210" rx="14" fill="#eff6ff" stroke="#0A66D6" stroke-width="2.5"/>
<rect x="470" y="120" width="8" height="210" rx="4" fill="#0A66D6"/>
<text x="492" y="150" font-size="17" font-weight="700" fill="#0f172a">Phone app (Android / iOS) · the brain</text>
<text x="492" y="174" font-size="13" fill="#334155">Voice Control screen: face, transcript, mic</text>
<text x="492" y="194" font-size="13" fill="#334155">Xiaozhi WebSocket session (Opus audio)</text>
<text x="492" y="214" font-size="13" fill="#334155">MCP tools: self.robot.move · self.robot.stop</text>
<text x="492" y="234" font-size="13" fill="#334155">        self.camera.take_photo</text>
<text x="492" y="254" font-size="13" fill="#334155">Offline fallback: built-in keyword interpreter</text>
<text x="492" y="274" font-size="13" fill="#334155">Re-sends c&lt;left&gt;,&lt;right&gt; every 250 ms</text>
<rect x="1080" y="120" width="280" height="210" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="1080" y="120" width="8" height="210" rx="4" fill="#7c3aed"/>
<text x="1102" y="150" font-size="17" font-weight="700" fill="#0f172a">Xiaozhi cloud</text>
<text x="1102" y="174" font-size="13" fill="#334155">xiaozhi.me / api.tenclass.net</text>
<text x="1102" y="194" font-size="13" fill="#334155">speech → text (STT)</text>
<text x="1102" y="214" font-size="13" fill="#334155">LLM decides what to do</text>
<text x="1102" y="234" font-size="13" fill="#334155">text → speech (TTS)</text>
<text x="1102" y="254" font-size="13" fill="#334155">vision explain (photos)</text>
<rect x="470" y="470" width="460" height="230" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<rect x="470" y="470" width="8" height="230" rx="4" fill="#16a34a"/>
<text x="492" y="500" font-size="17" font-weight="700" fill="#0f172a">ESP32 WROOM-32 · FriendBot firmware</text>
<text x="492" y="524" font-size="13" fill="#334155">Reads c / h / f / s / i lines from USB or BLE</text>
<text x="492" y="544" font-size="13" fill="#334155">Obstacle safety: slows from 50 cm, stops at 15 cm</text>
<text x="492" y="564" font-size="13" fill="#334155">Escape reflex: &lt; 5 cm → back up and turn</text>
<text x="492" y="584" font-size="13" fill="#334155">Failsafe: BLE lost or heartbeat late → stop</text>
<text x="492" y="604" font-size="13" fill="#334155">Speed ramp, then PWM to the motor driver</text>
<text x="492" y="624" font-size="13" fill="#334155">LCD shows speed, link and 3 distances</text>
<text x="492" y="644" font-size="13" fill="#334155">BLE name: “FriendBot: MTV”</text>
<rect x="1080" y="430" width="280" height="120" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<rect x="1080" y="430" width="8" height="120" rx="4" fill="#ea580c"/>
<text x="1102" y="460" font-size="17" font-weight="700" fill="#0f172a">L298N + 2 DC motors</text>
<text x="1102" y="484" font-size="13" fill="#334155">differential drive</text>
<text x="1102" y="504" font-size="13" fill="#334155">turn = wheels spin opposite</text>
<rect x="1080" y="580" width="280" height="120" rx="14" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="1080" y="580" width="8" height="120" rx="4" fill="#0e7490"/>
<text x="1102" y="610" font-size="17" font-weight="700" fill="#0f172a">3× HC-SR04 sonar</text>
<text x="1102" y="634" font-size="13" fill="#334155">left · middle · right</text>
<text x="1102" y="654" font-size="13" fill="#334155">+ 16×2 LCD, 2 LEDs</text>
<rect x="40" y="470" width="300" height="230" rx="14" fill="#ffffff" stroke="#ca8a04" stroke-width="2.5"/>
<rect x="40" y="470" width="8" height="230" rx="4" fill="#ca8a04"/>
<text x="62" y="500" font-size="17" font-weight="700" fill="#0f172a">Other phones (optional)</text>
<text x="62" y="524" font-size="13" fill="#334155">Same Wi-Fi network:</text>
<text x="62" y="544" font-size="13" fill="#334155">• drive through the host phone</text>
<text x="62" y="564" font-size="13" fill="#334155">  (“Controlling via … (WiFi)”)</text>
<text x="62" y="584" font-size="13" fill="#334155">• Remote Mic page = wireless</text>
<text x="62" y="604" font-size="13" fill="#334155">  microphone for the host</text>
<text x="62" y="624" font-size="13" fill="#334155">A STOP from any phone stops all</text>
<line x1="290" y1="205" x2="465" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="377.5" y="197.0" text-anchor="middle" font-size="12.5" fill="#0f172a">voice / taps</text>
<line x1="935" y1="190" x2="1075" y2="190" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1005.0" y="168" text-anchor="middle" font-size="12.5" fill="#0f172a">Opus audio up</text>
<text x="1005.0" y="184" text-anchor="middle" font-size="12.5" fill="#0f172a">text + JSON</text>
<line x1="1075" y1="265" x2="935" y2="265" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1005.0" y="283" text-anchor="middle" font-size="12.5" fill="#0f172a">speech reply +</text>
<text x="1005.0" y="299" text-anchor="middle" font-size="12.5" fill="#0f172a">tool call</text>
<line x1="700" y1="335" x2="700" y2="465" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="712" y="380" text-anchor="start" font-size="12.5" fill="#0f172a">BLE (Android + iOS)</text>
<text x="712" y="396" text-anchor="start" font-size="12.5" fill="#0f172a">or USB serial 115200</text>
<text x="712" y="412" text-anchor="start" font-size="12.5" fill="#0f172a">(Android only)</text>
<line x1="935" y1="520" x2="1075" y2="520" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1005.0" y="512.0" text-anchor="middle" font-size="12.5" fill="#0f172a">PWM</text>
<line x1="1075" y1="640" x2="935" y2="640" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1005.0" y="632.0" text-anchor="middle" font-size="12.5" fill="#0f172a">distances</text>
<line x1="345" y1="560" x2="640" y2="338" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="470" y="440" text-anchor="middle" font-size="12.5" fill="#0f172a">Wi-Fi relay</text>
<rect x="40" y="740" width="1320" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="60" y="770" font-size="15" font-weight="700" fill="#0f172a">Why this split?</text>
<text x="60" y="794" font-size="13" fill="#334155">The phone already has a microphone, speaker, camera, Wi-Fi and a fast processor, so all the “thinking” lives there and in the Xiaozhi cloud.</text>
<text x="60" y="814" font-size="13" fill="#334155">The ESP32 only does fast, safety-critical work (motors, sonars, failsafes). Example: a better AI model needs no firmware change — and the robot still stops at a wall even if the phone freezes.</text>
</svg>