<text x="535.0" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">iOS</text>
<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it does</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Draw a box round ANY object; the robot keeps it in the middle and drives to it.</text>
<text x="740" y="197" font-size="12.5" fill="#334155">Like longpth's OpenCV app (drag a rectangle, tracker follows it, the robot steers</text>
<text x="740" y="216" font-size="12.5" fill="#334155">from the box centre) — without the OpenCV library.</text>
<rect x="720" y="241" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="97" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">How to use it</text>
<text x="740" y="289" font-size="12.5" fill="#334155">1. Vision Modes → Target Tracking.  2. Drag a box round the object on the view.</text>
<text x="740" y="308" font-size="12.5" fill="#334155">3. Tap Lock target (button turns into Unlock).  4. Press Auto.</text>
<text x="740" y="327" font-size="12.5" fill="#334155">5. “Target lost — stop and re-lock”: the robot stops; draw and lock again.</text>
<rect x="720" y="352" width="640" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="116" rx="3" fill="#ca8a04"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">How it tracks</text>
<text x="740" y="400" font-size="12.5" fill="#334155">Android: TemplateTracker.java — normalised cross-correlation of a 24 × 24 grey patch</text>
<text x="740" y="419" font-size="12.5" fill="#334155">round the last position (step 4 px), score ≥ 0.55 = found (stands in for OpenCV MedianFlow).</text>
<text x="740" y="438" font-size="12.5" fill="#334155">iOS: Apple Vision VNTrackObjectRequest (the system's object tracker).</text>
<text x="740" y="457" font-size="12.5" fill="#334155">Box centre in left / middle / right third → (−1, 1) / (1, 1) / (1, −1).</text>
<rect x="720" y="482" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="482" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="508" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="530" font-size="12.5" fill="#334155">Lock on a toy car, push it slowly away: “▲ Tracking target” → c192,192;</text>
<text x="740" y="549" font-size="12.5" fill="#334155">push it to the left → “◀” → the robot spins left until the car is centred again.</text>
</svg>