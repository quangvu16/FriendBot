<text x="40" y="80" font-size="13" fill="#475569">Source: Android: vision/GuideFragment.java, res/values/strings.xml (guide_*) · iOS: Controllers/Vision/GuideController.swift</text>
<text x="40" y="100" font-size="13" fill="#475569">Text adapted from the instruction pages of Kirstin813/L4-Individual-Project. Mock-ups drawn from the layout code; values shown are examples.</text>
