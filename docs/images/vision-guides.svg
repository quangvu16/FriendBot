<rect x="720" y="130" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="130" width="6" height="97" rx="3" fill="#0A66D6"/>
<text x="740" y="156" font-size="15" font-weight="700" fill="#0f172a">What it is</text>
<text x="740" y="178" font-size="12.5" fill="#334155">Four built-in instruction pages, opened from More features → Guides or from the</text>
<text x="740" y="197" font-size="12.5" fill="#334155">“How to use” button on each Vision Mode: Coloured Object Instructions, Face</text>
<text x="740" y="216" font-size="12.5" fill="#334155">Instructions, Black Line Instructions, Object Avoidance Instructions.</text>
<rect x="720" y="241" width="640" height="97" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="241" width="6" height="97" rx="3" fill="#16a34a"/>
<text x="740" y="267" font-size="15" font-weight="700" fill="#0f172a">Each page has</text>
<text x="740" y="289" font-size="12.5" fill="#334155">What it does · You will need · Steps · Tips — adapted from the instruction pages</text>
<text x="740" y="308" font-size="12.5" fill="#334155">of Kirstin813's L4 Individual Project (credit line at the bottom of every page).</text>
<text x="740" y="327" font-size="12.5" fill="#334155">Target Tracking has no guide page: its “How to use” shows a short hint instead.</text>
<rect x="720" y="352" width="640" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="720" y="352" width="6" height="78" rx="3" fill="#7c3aed"/>
<text x="740" y="378" font-size="15" font-weight="700" fill="#0f172a">Example</text>
<text x="740" y="400" font-size="12.5" fill="#334155">Face Instructions → Steps 3: “Press Auto. A box appears around your face when it</text>
<text x="740" y="419" font-size="12.5" fill="#334155">is detected.” Tips: works up to about 2 m, keep your face well lit.</text>
</svg>