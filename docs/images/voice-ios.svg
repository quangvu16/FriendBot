<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 32px; font-weight: 700; fill: #1C1C1E; letter-spacing: -0.4px; }
      .pill { font-size: 12px; font-weight: 600; fill: #48484A; }
      .state { font-size: 15px; font-weight: 600; }
      .segsel { font-size: 13px; font-weight: 600; fill: #1C1C1E; }
      .segoff { font-size: 13px; font-weight: 600; fill: #636366; }
      .chip { font-size: 11px; font-weight: 600; fill: #48484A; }
      .bub { font-size: 15px; fill: #1C1C1E; }
      .bubw { font-size: 15px; fill: #FFFFFF; }
      .hint { font-size: 14px; fill: #8E8E93; }
      .tile { font-size: 10px; font-weight: 600; fill: #3A3A3C; }
      .tiler { font-size: 10px; font-weight: 600; fill: #D70015; }
      .spd { font-size: 13px; font-weight: 600; fill: #48484A; }
      .spdv { font-size: 13px; font-weight: 600; fill: #1C1C1E; }
      .log { font-size: 11px; fill: #636366; }
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <filter id="segshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="micshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0A66D6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="390" height="844" fill="#F2F2F7"/>

  <!-- large title + settings gear -->
  <text x="16" y="53" class="title">Voice Control</text>
  <g transform="translate(352,42)">
    <g transform="translate(-12,-12)">
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="#636366" stroke-width="2"/>
      <circle cx="12" cy="12" r="8.2" fill="none" stroke="#636366" stroke-width="2"/>
      <path d="M12 1.6v2.8M12 19.6v2.8M1.6 12h2.8M19.6 12h2.8M4.6 4.6l2 2M17.4 17.4l2 2M19.4 4.6l-2 2M6.6 17.4l-2 2" stroke="#636366" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- connection capsule -->
  <rect x="16" y="76" width="248" height="26" rx="13" fill="#E5E5EA"/>
  <g transform="translate(35,89) scale(0.58333) translate(-12,-12)">
    <path d="M7 7l10 10-5 5V2l5 5L7 17" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="48" y="93" class="pill">Connected (BLE) · Xiaozhi ready</text>

  <!-- face hero card -->
  <rect x="16" y="114" width="358" height="280" rx="22" fill="#FFFFFF" filter="url(#soft)"/>
  <!-- soft blue ring behind the face -->
  <circle cx="195" cy="198" r="65" fill="#EDF3FC" stroke="#0A66D6" stroke-width="2" opacity="0.55"/>
  <!-- friendly face + listening sound arcs -->
  <g transform="translate(143,146)">
    <circle cx="52" cy="52" r="46" fill="#FFD764"/>
    <circle cx="30" cy="62" r="6" fill="#FF9F8A" opacity="0.55"/>
    <circle cx="74" cy="62" r="6" fill="#FF9F8A" opacity="0.55"/>
    <path d="M26 36 Q32 31 38 35" fill="none" stroke="#3A3A3C" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M66 35 Q72 31 78 36" fill="none" stroke="#3A3A3C" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="48" r="5" fill="#3A3A3C"/>
    <circle cx="69" cy="48" r="5" fill="#3A3A3C"/>
    <path d="M38 66 Q52 78 66 66" fill="none" stroke="#3A3A3C" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M12 34 Q4 52 12 70" fill="none" stroke="#0A66D6" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M92 34 Q100 52 92 70" fill="none" stroke="#0A66D6" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- state caption -->
  <text x="195" y="288" text-anchor="middle" class="state" fill="#0A66D6">Listening…</text>
  <!-- listen-mode segmented toggle: Hands-free selected -->
  <rect x="72" y="302" width="246" height="38" rx="12" fill="#E5E5EA"/>
  <rect x="74" y="304" width="109" height="34" rx="10" fill="#FFFFFF" filter="url(#segshadow)"/>
  <text x="128.5" y="326" text-anchor="middle" class="segsel">Hands-free</text>
  <text x="250.5" y="326" text-anchor="middle" class="segoff">Push to speak</text>
  <!-- live waveform -->
  <g transform="translate(88,350)" fill="#0A66D6">
    <rect x="0" y="9" width="4" height="8" rx="2"/>
    <rect x="10" y="6" width="4" height="14" rx="2"/>
    <rect x="20" y="3" width="4" height="20" rx="2"/>
    <rect x="30" y="7.5" width="4" height="11" rx="2"/>
    <rect x="40" y="1" width="4" height="24" rx="2"/>
    <rect x="50" y="5.5" width="4" height="15" rx="2"/>
    <rect x="60" y="8.5" width="4" height="9" rx="2"/>
    <rect x="70" y="4" width="4" height="18" rx="2"/>
    <rect x="80" y="2" width="4" height="22" rx="2"/>
    <rect x="90" y="7" width="4" height="12" rx="2"/>
    <rect x="100" y="9.5" width="4" height="7" rx="2"/>
    <rect x="110" y="5" width="4" height="16" rx="2"/>
    <rect x="120" y="2.5" width="4" height="21" rx="2"/>
    <rect x="130" y="8" width="4" height="10" rx="2"/>
    <rect x="140" y="3.5" width="4" height="19" rx="2"/>
    <rect x="150" y="6" width="4" height="14" rx="2"/>
    <rect x="160" y="9" width="4" height="8" rx="2"/>
    <rect x="170" y="5.5" width="4" height="15" rx="2"/>
    <rect x="180" y="7.5" width="4" height="11" rx="2"/>
    <rect x="190" y="3" width="4" height="20" rx="2"/>
    <rect x="200" y="8.5" width="4" height="9" rx="2"/>
    <rect x="210" y="6.5" width="4" height="13" rx="2"/>
  </g>

  <!-- conversation transcript -->
  <rect x="135" y="471" width="120" height="23" rx="11.5" fill="#E5E5EA"/>
  <text x="195" y="486" text-anchor="middle" class="chip">» Move forward</text>
  <rect x="232" y="502" width="142" height="40" rx="20" fill="#0A66D6"/>
  <text x="246" y="527" class="bubw">You: Go forward</text>
  <rect x="16" y="550" width="288" height="40" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="30" y="575" class="bub">Xiaozhi: Okay — driving forward now.</text>

  <!-- input row: mic orb + message capsule + send orb -->
  <circle cx="44" cy="630" r="28" fill="#0A66D6" filter="url(#micshadow)"/>
  <g transform="translate(44,630) scale(1.08333) translate(-12,-12)">
    <rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF"/>
    <path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 18v3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="82" y="604" width="292" height="52" rx="26" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="94" y="635" class="hint" textLength="230" lengthAdjust="spacing">Or type a command, e.g. go forward</text>
  <circle cx="348" cy="630" r="20" fill="#0A66D6"/>
  <g transform="translate(348,630) scale(0.75) translate(-12,-12)">
    <path d="M3.5 11.2l16.8-7.7-7.7 16.8-2.3-6.8-6.8-2.3z" fill="#FFFFFF"/>
  </g>

  <!-- quick drive tiles -->
  <g>
    <rect x="16" y="670" width="65.2" height="64" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <g transform="translate(48.6,694) scale(0.83333) translate(-12,-12)">
      <path d="M12 20V5M5 12l7-7 7 7" fill="none" stroke="#3A3A3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="48.6" y="718" text-anchor="middle" class="tile">Forward</text>
    <rect x="89.2" y="670" width="65.2" height="64" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <g transform="translate(121.8,694) scale(0.83333) translate(-12,-12)">
      <path d="M12 4v15M5 12l7 7 7-7" fill="none" stroke="#3A3A3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="121.8" y="718" text-anchor="middle" class="tile">Backward</text>
    <rect x="162.4" y="670" width="65.2" height="64" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <g transform="translate(195,694) scale(0.83333) translate(-12,-12)">
      <path d="M20 12H5M12 5l-7 7 7 7" fill="none" stroke="#3A3A3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="195" y="718" text-anchor="middle" class="tile">Turn left</text>
    <rect x="235.6" y="670" width="65.2" height="64" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <g transform="translate(268.2,694) scale(0.83333) translate(-12,-12)">
      <path d="M4 12h15M12 5l7 7-7 7" fill="none" stroke="#3A3A3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="268.2" y="718" text-anchor="middle" class="tile">Turn right</text>
    <rect x="308.8" y="670" width="65.2" height="64" rx="16" fill="#FDECEA"/>
    <g transform="translate(341.4,694) scale(0.83333) translate(-12,-12)">
      <rect x="6" y="6" width="12" height="12" rx="2.5" fill="#D70015"/>
    </g>
    <text x="341.4" y="718" text-anchor="middle" class="tiler">Stop</text>
  </g>

  <!-- speed card -->
  <rect x="16" y="746" width="358" height="58" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <g transform="translate(39,775) scale(0.75) translate(-12,-12)">
    <path d="M4 15a8 8 0 0 1 16 0" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 15l4.5-4.5" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="58" y="780" class="spd">Speed</text>
  <rect x="104" y="772.5" width="222" height="5" rx="2.5" fill="#E5E5EA"/>
  <rect x="104" y="772.5" width="166.5" height="5" rx="2.5" fill="#0A66D6"/>
  <circle cx="270.5" cy="775" r="11" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1"/>
  <text x="360" y="780" text-anchor="end" class="spdv">75%</text>

  <!-- log caption -->
  <text x="16" y="827" class="log">Log · Move forward for 1000 ms</text>
</svg>
