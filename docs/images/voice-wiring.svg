<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#374151"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #111827; }
      .h { font-size: 14px; font-weight: bold; fill: #111827; }
      .lbl { font-size: 12px; fill: #111827; }
      .pin { font-size: 11px; fill: #1F2937; }
      .note { font-size: 11px; fill: #6B7280; }
      .sig { stroke: #2563EB; stroke-width: 2.5; fill: none; }
      .sig2 { stroke: #059669; stroke-width: 2.5; fill: none; }
      .pwr { stroke: #DC2626; stroke-width: 2.5; fill: none; }
      .gnd { stroke: #111827; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#F5F7FA"/>
  <text x="24" y="36" class="title">OpenBot 2WD wiring — ESP32 DevKitC V4 (WROOM-32U) + MX1508</text>

  <!-- ================= ESP32 board ================= -->
  <g>
    <rect x="60" y="90" width="240" height="430" rx="10" fill="#0B5394"/>
    <rect x="80" y="110" width="200" height="70" rx="6" fill="#111827"/>
    <text x="180" y="142" text-anchor="middle" class="h" fill="#FFFFFF">ESP32-DevKitC V4</text>
    <text x="180" y="162" text-anchor="middle" class="note" fill="#9CA3AF">WROOM-32U · 38 pin · ESP32</text>
    <rect x="150" y="480" width="60" height="18" rx="3" fill="#9CA3AF"/>
    <text x="180" y="512" text-anchor="middle" class="note">USB (flash + control link)</text>

    <!-- right pin labels -->
    <g class="pin">
      <circle cx="300" cy="220" r="4" fill="#FBBF24"/><text x="308" y="224">GPIO 16 (PWM)</text>
      <circle cx="300" cy="250" r="4" fill="#FBBF24"/><text x="308" y="254">GPIO 17 (PWM)</text>
      <circle cx="300" cy="280" r="4" fill="#FBBF24"/><text x="308" y="284">GPIO 18 (PWM)</text>
      <circle cx="300" cy="310" r="4" fill="#FBBF24"/><text x="308" y="314">GPIO 19 (PWM)</text>
      <circle cx="300" cy="450" r="4" fill="#111827"/><text x="308" y="454">GND</text>
    </g>
  </g>

  <!-- ================= MX1508 module ================= -->
  <g>
    <rect x="560" y="110" width="330" height="330" rx="10" fill="#166534"/>
    <text x="725" y="140" text-anchor="middle" class="h" fill="#FFFFFF">MX1508 dual H-bridge</text>
    <rect x="585" y="160" width="120" height="90" rx="6" fill="#0F172A"/>
    <text x="645" y="212" text-anchor="middle" class="pin" fill="#E5E7EB">MX1508 chip</text>
    <rect x="745" y="160" width="120" height="90" rx="6" fill="#0F172A"/>
    <text x="805" y="195" text-anchor="middle" class="pin" fill="#E5E7EB">AIN1-2 / BIN1-2</text>
    <text x="805" y="215" text-anchor="middle" class="pin" fill="#E5E7EB">no enable pins</text>
    <text x="805" y="235" text-anchor="middle" class="pin" fill="#FBBF24">every input is PWM</text>

    <!-- left-side screw terminals -->
    <g>
      <rect x="545" y="280" width="30" height="18" rx="3" fill="#DC2626"/><text x="537" y="294" text-anchor="end" class="pin">VCC</text>
      <rect x="545" y="310" width="30" height="18" rx="3" fill="#111827"/><text x="537" y="324" text-anchor="end" class="pin">GND</text>
      <rect x="545" y="385" width="30" height="18" rx="3" fill="#9CA3AF"/><text x="537" y="399" text-anchor="end" class="pin">AIN1</text>
      <rect x="545" y="415" width="30" height="18" rx="3" fill="#9CA3AF"/><text x="537" y="429" text-anchor="end" class="pin">AIN2</text>
    </g>
    <!-- right-side motor terminals -->
    <g>
      <rect x="875" y="280" width="30" height="18" rx="3" fill="#6B7280"/><text x="913" y="294" class="pin">M1+</text>
      <rect x="875" y="310" width="30" height="18" rx="3" fill="#6B7280"/><text x="913" y="324" class="pin">M1-</text>
      <rect x="875" y="355" width="30" height="18" rx="3" fill="#6B7280"/><text x="913" y="369" class="pin">M2+</text>
      <rect x="875" y="385" width="30" height="18" rx="3" fill="#6B7280"/><text x="913" y="399" class="pin">M2-</text>
    </g>
    <!-- bottom terminals BIN1/BIN2 -->
    <g>
      <rect x="640" y="425" width="30" height="18" rx="3" fill="#9CA3AF"/><text x="655" y="458" text-anchor="middle" class="pin">BIN1</text>
      <rect x="700" y="425" width="30" height="18" rx="3" fill="#9CA3AF"/><text x="715" y="458" text-anchor="middle" class="pin">BIN2</text>
    </g>
  </g>

  <!-- ================= signal wires: ESP32 -> MX1508 ================= -->
  <path class="sig" d="M 322,220 C 420,220 430,392 543,394" marker-end="url(#arrow)"/>
  <path class="sig" d="M 322,250 C 430,250 440,424 543,424" marker-end="url(#arrow)"/>
  <path class="sig2" d="M 322,280 C 400,280 380,510 640,448" marker-end="url(#arrow)"/>
  <path class="sig2" d="M 322,310 C 470,310 520,438 698,448" marker-end="url(#arrow)"/>
  <text x="430" y="330" class="note">AIN1/AIN2 = left motor · BIN1/BIN2 = right motor</text>

  <!-- ground wiring -->
  <path class="gnd" d="M 322,450 C 430,450 440,322 543,318" marker-end="url(#arrow)"/>

  <!-- ================= motors ================= -->
  <g>
    <circle cx="800" cy="545" r="38" fill="#E5E7EB" stroke="#6B7280" stroke-width="3"/>
    <circle cx="800" cy="545" r="14" fill="#9CA3AF"/>
    <text x="800" y="605" text-anchor="middle" class="h">left DC motor</text>
    <circle cx="905" cy="545" r="38" fill="#E5E7EB" stroke="#6B7280" stroke-width="3"/>
    <circle cx="905" cy="545" r="14" fill="#9CA3AF"/>
    <text x="880" y="605" text-anchor="middle" class="h">right motor</text>
    <path class="gnd" d="M 890,299 C 920,380 830,450 806,508" marker-end="url(#arrow)"/>
    <path class="gnd" d="M 890,320 C 930,390 900,440 898,506" marker-end="url(#arrow)"/>
    <path class="gnd" d="M 890,365 C 935,420 935,470 918,506" marker-end="url(#arrow)"/>
    <path class="gnd" d="M 890,394 C 940,430 950,470 935,506" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= batteries ================= -->
  <g>
    <rect x="60" y="560" width="150" height="50" rx="8" fill="#FCA5A5" stroke="#DC2626" stroke-width="2"/>
    <text x="135" y="582" text-anchor="middle" class="h">2S Li-ion 7.4 V</text>
    <text x="135" y="600" text-anchor="middle" class="note">motor battery → MX1508 VCC/GND</text>
    <path class="pwr" d="M 210,575 C 380,575 420,300 543,288" marker-end="url(#arrow)"/>
    <path class="gnd" d="M 210,595 C 380,595 420,330 543,318" marker-end="url(#arrow)"/>

    <text x="24" y="545" class="note">Share one GND between battery, MX1508 and ESP32.</text>
    <text x="24" y="632" class="note">GPIO 6-11 are the SPI flash bus on the WROOM-32U: never wire a motor there (GPIO 1/3 = UART0, 34-39 input-only).</text>
  </g>
</svg>
