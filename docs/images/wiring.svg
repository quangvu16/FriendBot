<text x="60" y="922" font-size="12.5" fill="#334155">① HC-SR04 ECHO is 5 V but the ESP32 is 3.3 V: put 1 kΩ in series and 2 kΩ to GND on every ECHO wire (shown as the small boxes).</text>
<text x="60" y="940" font-size="12.5" fill="#334155">② GPIO 2, 5, 12 and 15 are boot “strapping” pins. If the board will not boot or flash, unplug the middle sonar (GPIO 12) and the driver, flash, then plug back.</text>
<text x="60" y="958" font-size="12.5" fill="#334155">③ MX1508 instead of L298N: same IN1–IN4 wires, leave GPIO 5/18 unconnected (no EN pins), and feed the ESP32 5 V from a separate buck converter (MX1508 has no 5 V output).</text>
<text x="60" y="976" font-size="12.5" fill="#334155">④ Common ground: battery −, L298N GND, ESP32 GND, sonar GND and LCD GND must all be joined, or the motors twitch and sonars read garbage.</text>
</svg>