<text x="968" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#0A66D6">9</text>
<rect x="985" y="344" width="24" height="32" rx="5" fill="#f8fafc" stroke="#0A66D6"/>
<text x="997" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#0A66D6">1</text>
<rect x="1014" y="344" width="24" height="32" rx="5" fill="#f8fafc" stroke="#0A66D6"/>
<text x="1026" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#0A66D6">5</text>
<rect x="967" y="408" width="72" height="26" rx="6" fill="#7c3aed"/><text x="1003" y="425" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Confirm</text>
<text x="848" y="500" font-size="12.5" font-weight="700" fill="#0f172a">Type the code from step 1</text>
<text x="848" y="518" font-size="12.5" fill="#0f172a">agent card → Add Device</text>
<text x="848" y="536" font-size="12.5" fill="#0f172a">→ enter the 6 digits</text>
<text x="848" y="554" font-size="12.5" fill="#0f172a">→ Confirm</text>
<text x="848" y="572" font-size="12.5" fill="#0f172a">(within 5 minutes)</text>
<rect x="1096" y="120" width="244" height="476" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<circle cx="1122" cy="148" r="15" fill="#16a34a"/><text x="1122" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
<text x="1146" y="153" font-size="13" font-weight="700" fill="#16a34a">FriendBot app</text>
<rect x="1136" y="176" width="164" height="300" rx="22" fill="#0f172a"/>
<rect x="1144" y="184" width="148" height="284" rx="16" fill="#f2f2f7"/>
<text x="1218" y="216" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Voice Control</text>
<rect x="1152" y="232" width="132" height="20" rx="10" fill="#dcfce7"/><text x="1218" y="246" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Bound! Connecting…</text>
<circle cx="1218" cy="308" r="40" fill="#f5f9ff" stroke="#7aa7e6" stroke-width="2.5"/><circle cx="1218" cy="308" r="28" fill="#ffd966"/>
<circle cx="1209" cy="304" r="3.5" fill="#1f2937"/><circle cx="1227" cy="304" r="3.5" fill="#1f2937"/><path d="M1207,316 Q1218,326 1229,316" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
<text x="1218" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#0A66D6">Xiaozhi ready</text>
<rect x="1196" y="382" width="88" height="26" rx="13" fill="#0A66D6"/><text x="1240" y="399" text-anchor="middle" font-size="9.5" fill="#fff">You: xin chào</text>
<rect x="1152" y="414" width="112" height="26" rx="13" fill="#ffffff"/><text x="1160" y="431" font-size="9.5" fill="#111827">Xiaozhi: Chào bạn!</text>
<text x="1112" y="500" font-size="12.5" font-weight="700" fill="#0f172a">Done — talk!</text>
<text x="1112" y="518" font-size="12.5" fill="#0f172a">The app sees the binding</text>
<text x="1112" y="536" font-size="12.5" fill="#0f172a">in ≤ 2.5 s, saves the key</text>
<text x="1112" y="554" font-size="12.5" fill="#0f172a">and connects by itself</text>
<text x="1112" y="572" font-size="12.5" fill="#0f172a">next time too.</text>
<rect x="40" y="616" width="1320" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="60" y="648" font-size="17" font-weight="700" fill="#0f172a">Good to know</text>
<circle cx="68" cy="674" r="4" fill="#7c3aed"/>
<text x="82" y="678" font-size="13" fill="#0f172a"><tspan font-weight="700">The code only works while the app waits.</tspan> The app asks Xiaozhi every 2.5 s for up to 5 minutes. After that it says “timed out” — tap Retry for a new code.</text>
<circle cx="68" cy="700" r="4" fill="#7c3aed"/>
<text x="82" y="704" font-size="13" fill="#0f172a"><tspan font-weight="700">You pair once per phone.</tspan> The key is saved in the app. Re-pair only after reinstalling the app, clearing its data, or deleting the device in the console.</text>
<circle cx="68" cy="726" r="4" fill="#7c3aed"/>
<text x="82" y="730" font-size="13" fill="#0f172a"><tspan font-weight="700">The agent decides the personality.</tspan> Language, voice and model are set in the xiaozhi.me agent, not in the app. Change them there any time — no re-pairing.</text>
<circle cx="68" cy="752" r="4" fill="#7c3aed"/>
<text x="82" y="756" font-size="13" fill="#0f172a"><tspan font-weight="700">Robot moves are added by the app.</tspan> When it connects, the app tells Xiaozhi about self.robot.move / self.robot.stop / self.camera.take_photo. No set-up on the website.</text>
<circle cx="68" cy="778" r="4" fill="#7c3aed"/>
<text x="82" y="782" font-size="13" fill="#0f172a"><tspan font-weight="700">Several phones = several devices.</tspan> Each phone gets its own code; add them all to the same agent. Remote Mic phones need no pairing.</text>
</svg>