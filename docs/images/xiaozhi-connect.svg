<text x="162" y="293" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#0A66D6">482915</text>
<text x="162" y="328" text-anchor="middle" font-size="9.5" fill="#6b7280">Open xiaozhi.me, sign in,</text>
<text x="162" y="341" text-anchor="middle" font-size="9.5" fill="#6b7280">add a device, enter this code</text>
<text x="162" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ca8a04">Waiting for binding…</text>
<rect x="100" y="390" width="58" height="24" rx="8" fill="#e5e7eb"/><text x="129" y="406" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">RETRY</text>
