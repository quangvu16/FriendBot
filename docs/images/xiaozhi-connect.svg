<text x="56" y="500" font-size="12.5" font-weight="700" fill="#0f172a">Open Voice Control</text>
<text x="56" y="518" font-size="12.5" fill="#0f172a">The app registers with Xiaozhi</text>
<text x="56" y="536" font-size="12.5" fill="#0f172a">and shows a 6-digit code.</text>
<text x="56" y="554" font-size="12.5" fill="#0f172a">Leave this screen open.</text>
<text x="56" y="572" font-size="12.5" fill="#0f172a">Example code: 482915</text>
