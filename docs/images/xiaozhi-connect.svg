<text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">Connect FriendBot to xiaozhi.me · get the code and bind the phone</text>
<text x="40" y="80" font-size="14" fill="#475569">Sources: robot/android/.../voice/XiaozhiActivator.java (code, 2.5 s polling, 5 min limit) · xiaozhi.me console steps from the LAFVIN Xiaozhi tutorial (lafvinesp32-s3-169lcd2.readthedocs.io)</text>
