<text x="584" y="536" font-size="12.5" fill="#0f172a">Configure Role: language,</text>
<text x="584" y="554" font-size="12.5" fill="#0f172a">voice, model, personality</text>
<text x="584" y="572" font-size="12.5" fill="#0f172a">→ Save</text>
