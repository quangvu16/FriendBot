<rect x="597" y="361" width="186" height="20" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="605" y="375" font-size="10.5" fill="#334155">female, friendly</text>
<text x="597" y="394" font-size="10" fill="#6b7280">Language model</text>
<rect x="597" y="399" width="186" height="20" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="605" y="413" font-size="10.5" fill="#334155">default</text>
<text x="597" y="438" font-size="9.5" fill="#6b7280">Role introduction: “You are FriendBot,</text>
<text x="597" y="450" font-size="9.5" fill="#6b7280">a small robot car …”   </text>
