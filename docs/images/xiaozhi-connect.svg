<text x="320" y="500" font-size="12.5" font-weight="700" fill="#0f172a">Use a computer or 2nd phone</text>
<text x="320" y="518" font-size="12.5" fill="#0f172a">xiaozhi.me → Console</text>
<text x="320" y="536" font-size="12.5" fill="#0f172a">country + phone number,</text>
<text x="320" y="554" font-size="12.5" fill="#0f172a">picture code → Send Code,</text>
<text x="320" y="572" font-size="12.5" fill="#0f172a">type the SMS code.</text>
